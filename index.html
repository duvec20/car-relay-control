<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <title>Car Relay Control</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-connect {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            margin-bottom: 20px;
        }

        .btn-connect:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        .btn-disconnect {
            background: #475569;
            color: white;
            font-size: 14px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .relay-control {
            height: 280px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .relay-control.off {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
        }

        .relay-control.on {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 20px 50px rgba(34, 197, 94, 0.4);
        }

        .relay-control.locked {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .relay-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .relay-state {
            font-size: 48px;
            font-weight: bold;
        }

        .relay-action {
            font-size: 14px;
            opacity: 0.8;
        }

        .info-panel {
            background: rgba(51, 65, 85, 0.5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 14px;
        }

        .info-label {
            color: #94a3b8;
        }

        .info-value {
            font-weight: 600;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-control {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-lock {
            background: #475569;
            color: white;
        }

        .btn-lock.locked {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        }

        .btn-settings {
            background: #475569;
            color: white;
        }

        .settings-panel {
            background: rgba(51, 65, 85, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .settings-panel h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .setting-item {
            margin-bottom: 24px;
        }

        .setting-label {
            display: block;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .setting-value {
            color: white;
            font-weight: 600;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #475569;
            outline: none;
            margin-top: 8px;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }

        .slider-range {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 30px;
        }

        .hidden {
            display: none;
        }

        .icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Car Relay Control</h1>
            <div class="status-bar">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Not connected</span>
            </div>
        </div>

        <!-- Connect Button -->
        <button class="btn btn-connect" id="connectBtn" onclick="connectDevice()">
            <svg class="icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
            </svg>
            Connect to Device
        </button>

        <!-- Main Controls (hidden until connected) -->
        <div id="mainControls" class="hidden">
            <!-- Disconnect Button -->
            <button class="btn btn-disconnect" onclick="disconnectDevice()">Disconnect</button>

            <!-- Relay Toggle -->
            <div class="relay-control off" id="relayControl" onclick="toggleRelay()">
                <div class="relay-icon">⚡</div>
                <div class="relay-state" id="relayState">OFF</div>
                <div class="relay-action" id="relayAction">Tap to turn ON</div>
            </div>

            <!-- Info Panel -->
            <div class="info-panel">
                <div class="info-row">
                    <span class="info-label">Auto-shutoff Timer:</span>
                    <span class="info-value" id="timerDisplay">30 min</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Disconnect Timer:</span>
                    <span class="info-value" id="sleepDisplay">5 min</span>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="controls-grid">
                <button class="btn-control btn-lock" id="lockBtn" onclick="toggleLock()">
                    🔓 Unlocked
                </button>
                <button class="btn-control btn-settings" onclick="showSettings()">
                    ⚙️ Settings
                </button>
            </div>
        </div>

        <!-- Settings Panel (hidden by default) -->
        <div id="settingsPanel" class="settings-panel hidden">
            <h2>Settings</h2>
            
            <div class="setting-item">
                <label class="setting-label">
                    Auto-shutoff Timer: <span class="setting-value" id="shutoffValue">30 minutes</span>
                </label>
                <input type="range" min="5" max="240" step="5" value="30" class="slider" id="shutoffSlider">
                <div class="slider-range">
                    <span>5 min</span>
                    <span>4 hours</span>
                </div>
            </div>

            <div class="setting-item">
                <label class="setting-label">
                    Disconnect Sleep Timer: <span class="setting-value" id="sleepValue">5 minutes</span>
                </label>
                <input type="range" min="1" max="30" step="1" value="5" class="slider" id="sleepSlider">
                <div class="slider-range">
                    <span>1 min</span>
                    <span>30 min</span>
                </div>
            </div>

            <div class="controls-grid">
                <button class="btn-control" onclick="hideSettings()">Cancel</button>
                <button class="btn-control" style="background: #3b82f6;" onclick="saveSettings()">Save</button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Web Bluetooth API • Chrome/Edge Required</p>
            <p id="footerHelp">Make sure device is powered on and in range</p>
        </div>
    </div>

    <script>
        // BLE Configuration
        const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

        // State
        let device = null;
        let characteristic = null;
        let isConnected = false;
        let relayState = false;
        let isLocked = false;
        let autoShutoffTimer = 30;
        let sleepTimer = 5;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (!navigator.bluetooth) {
                alert('Web Bluetooth is not supported. Please use Chrome or Edge on Android.');
                return;
            }

            // Update slider displays
            document.getElementById('shutoffSlider').addEventListener('input', (e) => {
                document.getElementById('shutoffValue').textContent = e.target.value + ' minutes';
            });

            document.getElementById('sleepSlider').addEventListener('input', (e) => {
                document.getElementById('sleepValue').textContent = e.target.value + ' minutes';
            });
        });

        async function connectDevice() {
            try {
                updateStatus('Scanning...', false);
                
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'CarRelay' }],
                    optionalServices: [SERVICE_UUID]
                });

                updateStatus('Connecting...', false);
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                // Listen for notifications
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleNotification);

                isConnected = true;
                updateStatus('Connected', true);
                document.getElementById('mainControls').classList.remove('hidden');
                document.getElementById('connectBtn').classList.add('hidden');

                // Request status
                await sendCommand('GET_STATUS');

            } catch (error) {
                console.error('Connection error:', error);
                updateStatus('Connection failed', false);
                alert('Could not connect. Make sure device is on and in range.');
            }
        }

        async function disconnectDevice() {
            if (device && device.gatt.connected) {
                await device.gatt.disconnect();
            }
            isConnected = false;
            updateStatus('Disconnected', false);
            document.getElementById('mainControls').classList.add('hidden');
            document.getElementById('connectBtn').classList.remove('hidden');
        }

        async function sendCommand(command) {
            if (!characteristic) return;
            
            try {
                const encoder = new TextEncoder();
                await characteristic.writeValue(encoder.encode(command));
            } catch (error) {
                console.error('Send error:', error);
                alert('Command failed. Check connection.');
            }
        }

        function handleNotification(event) {
            const decoder = new TextDecoder();
            const value = decoder.decode(event.target.value);
            console.log('Received:', value);

            if (value.startsWith('RELAY_STATE:')) {
                const state = value.includes('ON');
                updateRelayDisplay(state);
            } else if (value.startsWith('TIMER_SET:')) {
                const minutes = parseInt(value.split(':')[1]);
                autoShutoffTimer = minutes;
                document.getElementById('timerDisplay').textContent = minutes + ' min';
            }
        }

        async function toggleRelay() {
            if (!isConnected || isLocked) {
                if (isLocked) alert('Unlock the app first');
                return;
            }

            const command = relayState ? 'RELAY_OFF' : 'RELAY_ON';
            await sendCommand(command);
            updateRelayDisplay(!relayState);
        }

        function updateRelayDisplay(state) {
            relayState = state;
            const control = document.getElementById('relayControl');
            const stateText = document.getElementById('relayState');
            const actionText = document.getElementById('relayAction');

            if (state) {
                control.className = 'relay-control on';
                stateText.textContent = 'ON';
                actionText.textContent = isLocked ? 'LOCKED' : 'Tap to turn OFF';
            } else {
                control.className = 'relay-control off';
                stateText.textContent = 'OFF';
                actionText.textContent = isLocked ? 'LOCKED' : 'Tap to turn ON';
            }

            if (isLocked) {
                control.classList.add('locked');
            }
        }

        async function toggleLock() {
            isLocked = !isLocked;
            const btn = document.getElementById('lockBtn');
            
            if (isLocked) {
                btn.className = 'btn-control btn-lock locked';
                btn.textContent = '🔒 Locked';
                await sendCommand('LOCK');
            } else {
                btn.className = 'btn-control btn-lock';
                btn.textContent = '🔓 Unlocked';
                await sendCommand('UNLOCK');
            }

            updateRelayDisplay(relayState);
        }

        function showSettings() {
            document.getElementById('mainControls').classList.add('hidden');
            document.getElementById('settingsPanel').classList.remove('hidden');
            
            // Set current values
            document.getElementById('shutoffSlider').value = autoShutoffTimer;
            document.getElementById('sleepSlider').value = sleepTimer;
            document.getElementById('shutoffValue').textContent = autoShutoffTimer + ' minutes';
            document.getElementById('sleepValue').textContent = sleepTimer + ' minutes';
        }

        function hideSettings() {
            document.getElementById('settingsPanel').classList.add('hidden');
            document.getElementById('mainControls').classList.remove('hidden');
        }

        async function saveSettings() {
            autoShutoffTimer = parseInt(document.getElementById('shutoffSlider').value);
            sleepTimer = parseInt(document.getElementById('sleepSlider').value);

            await sendCommand('SET_TIMER:' + autoShutoffTimer);
            await sendCommand('SET_SLEEP:' + sleepTimer);

            document.getElementById('timerDisplay').textContent = autoShutoffTimer + ' min';
            document.getElementById('sleepDisplay').textContent = sleepTimer + ' min';

            hideSettings();
        }

        function updateStatus(text, connected) {
            document.getElementById('statusText').textContent = text;
            const dot = document.getElementById('statusDot');
            
            if (connected) {
                dot.classList.add('connected');
            } else {
                dot.classList.remove('connected');
            }
        }
    </script>
</body>
</html>
